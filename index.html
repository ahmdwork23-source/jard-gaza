<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جرد بضاعة غزة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: a stock-taking tool — summary strip, alerts, then a box-label grid or a dense ledger. Kraft-box neutrals, teal ink, amber for attention. */
:root{
  --bg:#F1F3F2; --surface:#FFFFFF; --surface-2:#F7F8F7; --ink:#18201F; --muted:#5E6B69; --line:#DCE2E0;
  --accent:#0E6A6F; --accent-ink:#FFFFFF; --accent-soft:#E2F0F0;
  --warn:#9A6200; --warn-bg:#FFF3D6; --err:#B3261E; --err-bg:#FDE8E6; --ok:#1E7A45; --ok-bg:#E3F4EA;
  --kraft:#E9DFCB; --kraft-ink:#5A4A2C;
  --shadow:0 1px 2px rgba(20,30,30,.06),0 4px 14px rgba(20,30,30,.05);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1515; --surface:#172020; --surface-2:#1C2727; --ink:#E5ECEA; --muted:#97A6A3; --line:#2A3736;
  --accent:#4DB6BA; --accent-ink:#06201F; --accent-soft:#163334;
  --warn:#F2B84B; --warn-bg:#3A2C0D; --err:#FF8A80; --err-bg:#3D1A17; --ok:#6BD39A; --ok-bg:#12321F;
  --kraft:#3A3324; --kraft-ink:#E6D6B4; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1515; --surface:#172020; --surface-2:#1C2727; --ink:#E5ECEA; --muted:#97A6A3; --line:#2A3736;
  --accent:#4DB6BA; --accent-ink:#06201F; --accent-soft:#163334;
  --warn:#F2B84B; --warn-bg:#3A2C0D; --err:#FF8A80; --err-bg:#3D1A17; --ok:#6BD39A; --ok-bg:#12321F;
  --kraft:#3A3324; --kraft-ink:#E6D6B4; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--f-display);font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--err)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:clamp(20px,3.4vw,28px);font-weight:600;margin-top:2px;white-space:nowrap}
.stat .s{font-size:12px;color:var(--muted)}
.stat.hero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stat.hero .k,.stat.hero .s{color:inherit;opacity:.85}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.alerts{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.alerts summary{cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:600;list-style:none}
.alerts summary::-webkit-details-marker{display:none}
.alerts summary .chev{margin-inline-start:auto;transition:transform .2s;color:var(--muted)}
.alerts[open] summary .chev{transform:rotate(180deg)}
.alerts ul{list-style:none;margin:0;padding:0 16px 14px;display:flex;flex-direction:column;gap:6px}
.alerts li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.alerts li button{all:unset;cursor:pointer;color:var(--accent);font-weight:600;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.err{background:var(--err-bg);color:var(--err)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.kraft{background:var(--kraft);color:var(--kraft-ink)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .c{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search input{border:0;background:transparent;padding:9px 0;width:100%;min-width:0;outline:none}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 12px;display:flex;align-items:center;gap:5px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg svg{width:15px;height:15px}
.count-line{font-size:13px;color:var(--muted)}

/* grid of box-label cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:box-shadow .2s,border-color .2s}
.card.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.has-err{border-color:color-mix(in srgb,var(--err) 45%,var(--line))}
.ph{position:relative;aspect-ratio:4/3;background:var(--surface-2);cursor:zoom-in;border:0;padding:0;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .more{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.ph .idx{position:absolute;top:8px;right:8px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.noimg{display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:default}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.ttl{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ttl h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.3}
.price{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap;color:var(--accent)}
.price small{font-size:11px;font-weight:500;color:var(--muted);display:block;text-align:left}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;border:1px dashed var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.tag b{color:var(--ink);font-weight:600}
.kashf{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;direction:ltr;unicode-bidi:isolate;display:inline-block}
.count-box{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface-2);border-radius:10px;padding:10px}
.count-box label{font-size:12px;color:var(--muted);display:block}
.count-box .q{font-family:var(--f-display);font-weight:600;font-size:20px}
.inv{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:17px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.inv:disabled{opacity:.6}
.diffrow{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-height:20px;flex-wrap:wrap}
.notes{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.notes li{font-size:12.5px;line-height:1.45;padding:6px 8px;border-radius:7px;display:flex;gap:6px}
.notes li.err{background:var(--err-bg);color:var(--err)} .notes li.warn{background:var(--warn-bg);color:var(--warn)}
.notes li button{all:unset;cursor:pointer;text-decoration:underline;font-weight:600}

/* ledger (table view) */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:grid;grid-template-columns:64px minmax(0,2.2fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,.7fr) 104px minmax(0,.8fr);gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.lrow.head{border-top:0;background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:600;padding-block:9px}
.lrow .th{width:64px;height:48px;border-radius:8px;overflow:hidden;border:0;padding:0;cursor:zoom-in;background:var(--surface-2)}
.lrow .th img{width:100%;height:100%;object-fit:cover}
.lrow .nm{font-weight:600;font-size:14.5px}
.lrow .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.lrow .inv{font-size:15px;padding:5px 6px}
.lrow .flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.lrow.flash{background:var(--accent-soft)}
.c-sz,.c-df{font-size:13.5px}
@media (max-width:760px){
  .lrow{grid-template-columns:52px minmax(0,1fr) auto 76px;gap:10px;padding:10px 12px}
  .lrow .th{width:52px;height:44px}
  .lrow .c-sz,.lrow .c-qty,.lrow .c-df{display:none}
  .lrow .m-only{display:flex}
}
.m-only{display:none}
.who-row{display:flex;gap:10px;flex-wrap:wrap}.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);flex:1 1 200px;min-width:0;max-width:320px}.fld input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:15px;color:var(--ink)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.banner{border-radius:var(--r);padding:10px 14px;font-size:13.5px;background:var(--warn-bg);color:var(--warn)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(5,10,10,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:78vh;border-radius:10px;object-fit:contain;background:#111}
.lb .cap{color:#fff;text-align:center;font-size:15px}
.lb .cap b{font-family:var(--f-display)}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));all:unset;cursor:pointer;color:#fff;font-size:28px;line-height:1;padding:8px 12px;position:absolute}
.lb .nav{display:flex;gap:10px}
.lb .nav button{all:unset;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 16px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>جرد بضاعة غزة</h1>
      <p>صور الأصناف وأسعار الحبة بالشيكل، مع خانة «العدد بعد الجرد» المحفوظة في جدول مشترك.</p>
    </div>
    <div class="hdr-actions">
      <span class="sync" id="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">جارٍ الاتصال…</span></span>
      <button class="btn" id="themeBtn" type="button" aria-label="تبديل الوضع الفاتح والداكن">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="themeTxt">الوضع</span></button>
      <button class="btn primary" id="zipBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg><span id="zipTxt">تنزيل كل الصور (ZIP)</span></button>
    </div>
  </header>

  <div class="who-row">
    <label class="fld"><span>اسمك (يظهر بجانب كل عدد تسجّله)</span><input id="who" type="text" maxlength="40" placeholder="مثال: محمد" autocomplete="name"></label>
    <label class="fld" id="pinWrap" hidden><span>رمز التعديل</span><input id="pin" type="password" inputmode="numeric" maxlength="20" placeholder="••••"></label>
  </div>
  <div id="banner" class="banner" hidden></div>

  <section class="stats" id="stats" aria-label="ملخص"></section>

  <details class="alerts" id="alerts">
    <summary><span id="alertsTitle">تنبيهات</span><span style="font-weight:400;font-size:13px;color:var(--muted)">اضغط لعرض التفاصيل</span><span class="chev">▾</span></summary>
    <ul id="alertsList"></ul>
  </details>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <div class="toolbar">
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ابحث بالاسم، رقم الكشف، الارتكل، المقاس…" aria-label="بحث"></label>
    <select id="sort" class="sel" aria-label="الفرز">
      <option value="n">ترتيب الإكسل</option>
      <option value="pa">السعر: الأقل أولاً</option>
      <option value="pd">السعر: الأعلى أولاً</option>
      <option value="qd">الكمية: الأكثر أولاً</option>
      <option value="name">الاسم (أ–ي)</option>
      <option value="diff">أكبر فرق جرد</option>
    </select>
    <div class="seg" role="group" aria-label="طريقة العرض">
      <button type="button" id="vGrid" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>شبكة</button>
      <button type="button" id="vTable" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>جدول</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <span class="count-line num" id="countLine" style="margin-inline-start:auto"></span>
  </div>

  <main id="list"></main>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="عرض الصورة">
  <button class="x" id="lbX" type="button" aria-label="إغلاق">×</button>
  <img id="lbImg" alt="">
  <div class="cap" id="lbCap"></div>
  <div class="nav" id="lbNav"><button type="button" id="lbPrev">السابقة</button><button type="button" id="lbNext">التالية</button></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>

const SHEETS = DATA.sheets, P = DATA.products;

const sheetName = id => (SHEETS.find(s=>s.id===id)||{}).name||id;
const counts = {};      // key -> {count, at, by}
const pending = {};     // key -> timer
let db=null, user=null, canWrite=true, myId=null, profiles={};
const st = {tab:'all', q:'', sort:'n', view:'grid', filter:'all'};

const saveUI=()=>{try{localStorage.setItem('jard-ui',JSON.stringify({view:st.view,tab:st.tab}))}catch(e){}};

const fmtN = n => n==null?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const fmtS = n => n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₪';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const thumb = f => `img/t/${f}.webp`, full = f => `img/f/${f}.jpg`;

function cnt(p){ const c=counts[p.key]; return c && typeof c.count==='number' ? c.count : null; }
function diff(p){ const c=cnt(p); return c==null||p.qty==null?null:c-p.qty; }
function liveNotes(p){
  const n=[...p.notes]; const d=diff(p);
  if(d!=null && d!==0) n.unshift({t:'err',m:`العدد بعد الجرد (${cnt(p)}) لا يطابق الوارد (${p.qty}) — ${d<0?'عجز':'زيادة'} ${Math.abs(d)}`});
  return n;
}

/* ---------- summary ---------- */
function scope(){ return st.tab==='all'?P:P.filter(p=>p.sheet===st.tab); }
function renderStats(){
  const S=scope();
  const qty=S.reduce((a,p)=>a+(p.qty||0),0);
  const val=S.reduce((a,p)=>a+(p.qty||0)*(p.price||0),0);
  const done=S.filter(p=>cnt(p)!=null).length;
  const mism=S.filter(p=>{const d=diff(p);return d!=null&&d!==0}).length;
  const short=S.reduce((a,p)=>{const d=diff(p);return a+(d!=null&&d<0?-d:0)},0);
  const label= st.tab==='all'?'كل الأوراق':sheetName(st.tab);
  $('stats').innerHTML=`
   <div class="stat hero"><div class="k">قيمة البضاعة — ${esc(label)}</div><div class="v num">${fmtS(val)}</div><div class="s">الكمية الواردة × سعر الحبة</div></div>
   <div class="stat"><div class="k">عدد الأصناف</div><div class="v num">${S.length}</div><div class="s">${st.tab==='all'?SHEETS.map(s=>`${esc(s.name)}: ${P.filter(p=>p.sheet===s.id).length}`).join(' · '):'في هذا التبويب'}</div></div>
   <div class="stat"><div class="k">إجمالي الكميات (ع وارد)</div><div class="v num">${fmtN(qty)}</div><div class="s">حبة / جوز</div></div>
   <div class="stat"><div class="k">تقدّم الجرد</div><div class="v num">${done} / ${S.length}</div><div class="s">${mism?`<span class="pill err">${mism} فرق · عجز ${short}</span>`:'لا فروقات حتى الآن'}</div><div class="bar"><i style="width:${S.length?done/S.length*100:0}%"></i></div></div>`;
}

/* ---------- alerts ---------- */
function renderAlerts(){
  const items=[];
  DATA.alerts.filter(a=>st.tab==='all'||a.sheet===st.tab).forEach(a=>items.push({t:a.t,m:`<b>${esc(sheetName(a.sheet))}:</b> ${esc(a.m)}`}));
  scope().forEach(p=>liveNotes(p).forEach(n=>items.push({t:n.t,m:`<b>${esc(p.name)}</b> <span class="kashf">${esc(p.kashf||'')}</span> — ${esc(n.m)}`,key:p.key})));
  const nErr=items.filter(i=>i.t==='err').length, nW=items.filter(i=>i.t==='warn').length;
  $('alertsTitle').innerHTML=`تنبيهات <span class="pill err">${nErr} خطأ</span> <span class="pill warn">${nW} ملاحظة</span>`;
  const lbl={err:'خطأ',warn:'ملاحظة',ok:'مطابق'};
  $('alertsList').innerHTML=items.map(i=>`<li><span class="pill ${i.t}">${lbl[i.t]}</span><span style="flex:1;min-width:0">${i.m}</span>${i.key?`<button type="button" data-goto="${i.key}">اعرض</button>`:''}</li>`).join('')||'<li>لا توجد تنبيهات.</li>';
}

/* ---------- tabs / chips ---------- */
function renderTabs(){
  const t=[{id:'all',name:'الكل',n:P.length},...SHEETS.map(s=>({id:s.id,name:s.name,n:P.filter(p=>p.sheet===s.id).length}))];
  $('tabs').innerHTML=t.map(x=>`<button class="tab" role="tab" type="button" data-tab="${x.id}" aria-selected="${st.tab===x.id}">${esc(x.name)}<span class="c num">${x.n}</span></button>`).join('');
}
function renderChips(){
  const c=[['all','الكل'],['todo','لم يُجرد'],['mism','فيه فرق'],['notes','عليه تنبيه'],['inv11','فاتورة جديدة 11']];
  const show=c.filter(([k])=>k!=='inv11'||scope().some(p=>p.inv11));
  if(!show.find(([k])=>k===st.filter)) st.filter='all';
  $('chips').innerHTML=show.map(([k,l])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${st.filter===k}">${l}</button>`).join('');
}

/* ---------- list ---------- */
function filtered(){
  const q=st.q.trim().toLowerCase();
  let L=scope().filter(p=>{
    if(st.filter==='todo'&&cnt(p)!=null) return false;
    if(st.filter==='mism'){const d=diff(p); if(d==null||d===0) return false;}
    if(st.filter==='notes'&&!liveNotes(p).length) return false;
    if(st.filter==='inv11'&&!p.inv11) return false;
    if(!q) return true;
    return [p.name,p.art,p.kashf,p.sizes,p.xxx,p.serial,p.price].some(v=>v!=null&&String(v).toLowerCase().includes(q));
  });
  const ord={n:(a,b)=>(a.sheet>b.sheet?1:a.sheet<b.sheet?-1:a.n-b.n),pa:(a,b)=>(a.price??1e9)-(b.price??1e9),pd:(a,b)=>(b.price??-1)-(a.price??-1),
    qd:(a,b)=>(b.qty??-1)-(a.qty??-1),name:(a,b)=>String(a.name).localeCompare(String(b.name),'ar'),diff:(a,b)=>Math.abs(diff(b)??-1)-Math.abs(diff(a)??-1)};
  return L.sort(ord[st.sort]);
}
function inputHTML(p,cls=''){
  const c=cnt(p);
  return `<input class="inv ${cls}" id="inv-${p.key}" data-key="${p.key}" type="number" inputmode="numeric" min="0" step="1" value="${c??''}" placeholder="—" aria-label="العدد بعد الجرد — ${esc(p.name)}" ${(!db||!canWrite)?'disabled':''}>`;
}
function diffHTML(p){
  const d=diff(p), c=counts[p.key];
  let s = d==null?'<span>لم يُجرد بعد</span>': d===0?'<span class="pill ok">مطابق ✓</span>': `<span class="pill err">${d<0?'عجز':'زيادة'} ${Math.abs(d)}</span>`;
  let who='';
  if(c&&c.at){ const nm=c.by||''; who=`<span>${nm?esc(nm)+' · ':''}${new Date(c.at).toLocaleString('ar-EG-u-nu-latn',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>`; }
  return s+who;
}
function card(p){
  const notes=liveNotes(p), img=p.imgs[0];

    <div class="body">
      <div class="ttl"><h3>${esc(p.name)}</h3><div class="price num">${fmtS(p.price)}<small>سعر الحبة</small></div></div>

      </div>

        <div><label for="inv-${p.key}">العدد بعد الجرد</label>${inputHTML(p)}</div>
        <div class="diffrow" id="d-${p.key}">${diffHTML(p)}</div>
      </div>
      ${notes.length?`<ul class="notes">${notes.map(n=>`<li class="${n.t}"><span>${n.t==='err'?'⚠':'•'}</span><span>${esc(n.m)}${n.ref?` <button type="button" data-goto="${n.ref}">انتقل للصنف الآخر</button>`:''}</span></li>`).join('')}</ul>`:''}
    </div></article>`;
}
function row(p){

}
function renderAll(){ renderStats(); renderAlerts(); renderTabs(); renderChips(); renderList();
  $('vGrid').setAttribute('aria-pressed',st.view==='grid'); $('vTable').setAttribute('aria-pressed',st.view==='table'); }

/* refresh one product in place without stealing focus */
function refreshProduct(key){
  const p=byKey[key]; const el=$('c-'+key); if(!el) return;
  const inp=$('inv-'+key);
  if(inp && document.activeElement===inp){ const d=$('d-'+key); if(d) d.innerHTML = st.view==='grid'?diffHTML(p):(diff(p)==null?'—':diff(p)===0?'<span class="pill ok">مطابق</span>':`<span class="pill err">${diff(p)<0?'−':'+'}${Math.abs(diff(p))}</span>`); return; }
  const tmp=document.createElement('div'); tmp.innerHTML=(st.view==='grid'?card(p):row(p)).trim();
  el.replaceWith(tmp.firstElementChild);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-f],[data-lb],[data-goto]'); if(!t) return;
  if(t.dataset.tab){ st.tab=t.dataset.tab; saveUI(); renderAll(); }
  else if(t.dataset.f){ st.filter=t.dataset.f; renderChips(); renderList(); }
  else if(t.dataset.lb){ openLB(t.dataset.lb,0); }
  else if(t.dataset.goto){ goTo(t.dataset.goto); }
});
function goTo(key){
  const p=byKey[key]; if(!p) return;
  if(st.tab!=='all'&&st.tab!==p.sheet) st.tab=p.sheet;
  st.q=''; $('q').value=''; st.filter='all'; renderAll();
  const el=$('c-'+key); if(!el) return;
  el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'center'});
  el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),2200);
}
$('q').addEventListener('input',e=>{st.q=e.target.value; renderList();});
$('sort').addEventListener('change',e=>{st.sort=e.target.value; renderList();});
$('vGrid').onclick=()=>{st.view='grid';saveUI();renderAll();};
$('vTable').onclick=()=>{st.view='table';saveUI();renderAll();};

let cbSeq=0;
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const name='__jard'+(++cbSeq)+'_'+Date.now();
    const qs=Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v==null?'':v)).join('&');
    const s=document.createElement('script');
    let t;
    const done=()=>{ clearTimeout(t); delete window[name]; s.remove(); };
    t=setTimeout(()=>{ done(); reject(new Error('timeout')); },15000);
    window[name]=(data)=>{ done(); resolve(data); };
    s.onerror=()=>{ done(); reject(new Error('network')); };
    s.src=API+'?'+qs+'&callback='+name;
    document.head.appendChild(s);
  });
}
/* inventory input → Google Sheet (debounced, one write per product at a time) */
const inflight={};
function meta(p){ return {sheet:sheetName(p.sheet),name:p.name,kashf:p.kashf,qty:p.qty}; }
async function commit(key){
  clearTimeout(pending[key]); delete pending[key];
  const inp=$('inv-'+key); if(!inp||!db) return;
  const raw=inp.value.trim();
  if(raw!==''&&!isFinite(Number(raw))) return;
  const val= raw===''?null:Math.max(0,Math.round(Number(raw)));
  const cur=cnt(byKey[key]); if(cur===val) return;
  if(needPin && !getPin()){ toast('اكتب رمز التعديل أولاً'); $('pin').focus(); return; }
  if(inflight[key]){ await inflight[key].catch(()=>{}); }
  const prev=counts[key];
  if(val==null) delete counts[key]; else counts[key]={count:val,at:Date.now(),by:getName()};
  refreshSummary(key);
  const m=meta(byKey[key]);
  inflight[key]=jsonp({action:'set',key,count:val==null?'':val,by:getName(),pin:getPin(),sheet:m.sheet,name:m.name,kashf:m.kashf||'',qty:m.qty==null?'':m.qty})
    .then(j=>{
      if(j.ok){ setSync(true); return; }
      if(prev) counts[key]=prev; else delete counts[key];
      refreshSummary(key);
      if(j.error==='bad_pin'){ toast('رمز التعديل غير صحيح — لم يُحفظ العدد'); $('pin').focus(); }
      else toast('لم يُحفظ العدد ('+(j.error||'خطأ')+')');
    }).catch(()=>{ setSync(false,'غير متصل'); toast('لم يُحفظ العدد — تحقق من الإنترنت وأعد المحاولة'); })
    .finally(()=>{delete inflight[key];});
}
document.addEventListener('input',e=>{ if(e.target.classList.contains('inv')){ const k=e.target.dataset.key; clearTimeout(pending[k]); pending[k]=setTimeout(()=>commit(k),900);} });
document.addEventListener('change',e=>{ if(e.target.classList.contains('inv')) commit(e.target.dataset.key); });
function refreshSummary(key){ renderStats(); renderAlerts(); if(key) refreshProduct(key); }
document.addEventListener('input',e=>{ if(e.target.classList.contains('inv')){ const k=e.target.dataset.key; clearTimeout(pending[k]); pending[k]=setTimeout(()=>commit(k),800);} });
document.addEventListener('change',e=>{ if(e.target.classList.contains('inv')) commit(e.target.dataset.key); });
function refreshSummary(key){ renderStats(); renderAlerts(); if(key) refreshProduct(key); }

/* ---------- lightbox ---------- */
let lbState=null;
function openLB(key,i){ const p=byKey[key]; if(!p||!p.imgs.length) return; lbState={key,i}; showLB(); $('lb').hidden=false; $('lbX').focus(); }
function showLB(){ const p=byKey[lbState.key], f=p.imgs[lbState.i];
  $('lbImg').src=thumb(f); const big=new Image(); big.onload=()=>{ if(lbState&&byKey[lbState.key].imgs[lbState.i]===f) $('lbImg').src=big.src; }; big.src=full(f);
  $('lbImg').alt=p.name; $('lbCap').innerHTML=`<b>${esc(p.name)}</b> · <span class="num">${fmtS(p.price)}</span> للحبة${p.kashf?` · <span class="kashf">${esc(p.kashf)}</span>`:''}${p.imgs.length>1?` · صورة ${lbState.i+1} من ${p.imgs.length}`:''}`;
  $('lbNav').hidden=p.imgs.length<2; }
function closeLB(){ $('lb').hidden=true; lbState=null; }
$('lbX').onclick=closeLB; $('lb').addEventListener('click',e=>{ if(e.target.id==='lb') closeLB(); });
$('lbNext').onclick=()=>{const n=byKey[lbState.key].imgs.length; lbState.i=(lbState.i+1)%n; showLB();};
$('lbPrev').onclick=()=>{const n=byKey[lbState.key].imgs.length; lbState.i=(lbState.i-1+n)%n; showLB();};
document.addEventListener('keydown',e=>{ if(!lbState) return; if(e.key==='Escape') closeLB(); });

/* ---------- theme ---------- */
function curTheme(){ const a=document.documentElement.dataset.theme; return a || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }
function paintThemeBtn(){ $('themeTxt').textContent = curTheme()==='dark'?'الوضع الفاتح':'الوضع الداكن'; }
try{ const t=localStorage.getItem('jard-theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
$('themeBtn').onclick=()=>{ const n=curTheme()==='dark'?'light':'dark'; document.documentElement.dataset.theme=n; try{localStorage.setItem('jard-theme',n)}catch(e){} paintThemeBtn(); };
paintThemeBtn();

/* ---------- misc ---------- */
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,3500); }
function showBanner(m){ $('banner').textContent=m; $('banner').hidden=false; }
function setSync(on,txt){ $('syncDot').className='dot '+(on?'on':'off'); $('syncTxt').textContent= txt || (on?'متزامن مع كل الأجهزة':'غير متصل'); }

/* ---------- ZIP export ---------- */
const safe=s=>String(s??'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim();
$('zipBtn').onclick=async()=>{
  if(!window.JSZip){ toast('مكتبة الضغط لم تُحمَّل — أعد تحميل الصفحة'); return; }
  const btn=$('zipBtn'); btn.disabled=true;
  try{
    const zip=new JSZip(); let done=0; const all=P.flatMap(p=>p.imgs.map((f,i)=>({p,f,i})));
    for(const {p,f,i} of all){
      const r=await fetch(full(f)); if(!r.ok) throw new Error('fetch');
      const name=`${String(p.n).padStart(2,'0')} - ${safe(p.name)}${p.kashf?' - '+safe(p.kashf):''}${p.imgs.length>1?' ('+(i+1)+')':''}.jpg`;
      zip.folder(safe(sheetName(p.sheet))).file(name, await r.blob());
      $('zipTxt').textContent=`جارٍ التجهيز ${++done}/${all.length}`;
    }
    const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='صور الأصناف - جرد غزة.zip';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    toast('بدأ تنزيل ملف الصور');
  }catch(err){ toast('تعذّر تجهيز ملف الصور — تحقق من الإنترنت'); }
  finally{ btn.disabled=false; $('zipTxt').textContent='تنزيل كل الصور (ZIP)'; }
};

/* ---------- name & PIN (kept on this device) ---------- */
let needPin=false;
const getName=()=>$('who').value.trim(), getPin=()=>$('pin').value.trim();
try{ $('who').value=localStorage.getItem('jard-who')||''; $('pin').value=localStorage.getItem('jard-pin')||''; }catch(e){}
$('who').addEventListener('change',()=>{try{localStorage.setItem('jard-who',getName())}catch(e){}});
$('pin').addEventListener('change',()=>{try{localStorage.setItem('jard-pin',getPin())}catch(e){}});

renderAll();

/* ---------- sync with Google Sheet (polling) ---------- */
async function pull(){
  if(!API) return;
  try{
    const j=await jsonp({action:'list'});
    if(!j.ok) throw 0;
    needPin=!!j.pin; $('pinWrap').hidden=!needPin;
    const remote=j.counts||{}, changed=[];
    for(const k of new Set([...Object.keys(remote),...Object.keys(counts)])){
      if(!byKey[k]||pending[k]||inflight[k]) continue;
      const a=counts[k], b=remote[k];
      if(JSON.stringify(a&&[a.count,a.by])!==JSON.stringify(b&&[b.count,b.by])){ if(b) counts[k]=b; else delete counts[k]; changed.push(k); }
    }
    setSync(true,'متزامن · آخر تحديث '+new Date().toLocaleTimeString('ar-EG-u-nu-latn',{hour:'2-digit',minute:'2-digit'}));
    if(changed.length){ renderStats(); renderAlerts(); renderChips(); if(changed.length>12) renderList(); else changed.forEach(refreshProduct); }
  }catch(e){ setSync(false,'تعذّر الاتصال بجدول الجرد'); }
}
if(!API){ db=null; setSync(false,'جدول الجرد غير مربوط'); showBanner('لم يُربط جدول Google Sheets بعد — الأعداد لن تُحفظ حتى يتم الربط.'); renderList(); }
else { db=true; renderList(); pull(); setInterval(()=>{ if(!document.hidden) pull(); },12000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull(); }); }
</script>
